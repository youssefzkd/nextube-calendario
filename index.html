<title>Calendario Nextube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --bg:#110d0d;
    --bg-grain:#1a1414;
    --surface:#1c1616;
    --surface-hover:#251d1d;
    --border:#332828;
    --text:#f3eeec;
    --text-muted:#9a8c89;
    --text-faint:#5f5451;
    --accent:#e5262b;
    --accent-strong:#ff4348;
    --accent-ink:#ffffff;
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Manrope',system-ui,-apple-system,sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background-image:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(229,38,43,0.16), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 10%, rgba(229,38,43,0.08), transparent 55%);
  }

  .app{
    flex:1;
    display:flex;
    flex-direction:column;
    max-width:1180px;
    width:100%;
    margin:0 auto;
    padding:20px 24px 28px;
    min-height:100vh;
  }

  /* ---------- header / brand ---------- */
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
    padding-bottom:18px;
  }
  .brand-mark{
    width:38px;
    height:38px;
    flex-shrink:0;
  }
  .brand-word{
    font-family:'Anton',system-ui,sans-serif;
    font-size:22px;
    letter-spacing:0.5px;
    color:var(--text);
    line-height:1;
  }
  .brand-tag{
    margin-left:auto;
    font-size:11px;
    font-weight:700;
    letter-spacing:1.8px;
    text-transform:uppercase;
    color:var(--text-faint);
  }

  /* ---------- month nav ---------- */
  .month-nav{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:22px;
    padding:6px 0 20px;
  }
  .nav-btn{
    width:44px;
    height:44px;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
    font-size:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:background .15s ease, border-color .15s ease, transform .1s ease;
    flex-shrink:0;
  }
  .nav-btn:hover:not(:disabled){
    background:var(--surface-hover);
    border-color:var(--accent);
    color:var(--accent-strong);
  }
  .nav-btn:active:not(:disabled){ transform:scale(0.94); }
  .nav-btn:disabled{
    opacity:0.28;
    cursor:default;
  }
  .nav-btn:focus-visible{ outline:2px solid var(--accent-strong); outline-offset:2px; }
  .nav-btn.next:not(:disabled){
    background:var(--accent);
    border-color:var(--accent);
  }
  .nav-btn.next:not(:disabled):hover{
    background:var(--accent-strong);
    border-color:var(--accent-strong);
    color:#fff;
  }

  .month-title{
    font-family:'Anton',system-ui,sans-serif;
    font-size:clamp(28px,5vw,44px);
    letter-spacing:0.5px;
    text-transform:uppercase;
    min-width:280px;
    text-align:center;
  }
  .month-title .year{ color:var(--text-muted); }

  .month-dots{
    display:flex;
    justify-content:center;
    gap:6px;
    padding-bottom:18px;
  }
  .month-dots span{
    width:6px;height:6px;border-radius:50%;
    background:var(--border);
  }
  .month-dots span.active{ background:var(--accent); }

  /* ---------- weekday header ---------- */
  .weekdays{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:8px;
    padding-bottom:8px;
  }
  .weekdays span{
    text-align:center;
    font-size:11px;
    font-weight:700;
    letter-spacing:1.6px;
    text-transform:uppercase;
    color:var(--text-faint);
  }

  /* ---------- calendar grid ---------- */
  .calendar-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    grid-auto-rows:1fr;
    gap:8px;
    flex:1;
    min-height:360px;
  }
  .day{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:8px 9px;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:6px;
    cursor:pointer;
    position:relative;
    transition:background .15s ease, border-color .15s ease;
    font-variant-numeric:tabular-nums;
  }
  .day:hover{
    background:var(--surface-hover);
    border-color:var(--text-faint);
  }
  .day:focus-visible{ outline:2px solid var(--accent-strong); outline-offset:1px; }
  .day.blank{
    background:transparent;
    border-color:transparent;
    cursor:default;
    pointer-events:none;
  }
  .day.past{ opacity:0.4; }
  .day.past .day-number{ color:var(--text-muted); }

  .day-number{
    font-size:15px;
    font-weight:700;
    width:26px;height:26px;
    display:flex;align-items:center;justify-content:center;
    border-radius:50%;
    flex-shrink:0;
  }
  .day.today .day-number{
    background:var(--accent);
    color:var(--accent-ink);
  }

  .day-events{
    display:flex;
    flex-direction:column;
    gap:3px;
    width:100%;
    overflow:hidden;
  }
  .event-chip{
    font-size:10.5px;
    font-weight:600;
    line-height:1.25;
    padding:2px 6px;
    border-radius:5px;
    background:rgba(229,38,43,0.16);
    color:#ffb3b3;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    width:100%;
  }
  .event-chip.mentoria{
    background:rgba(255,255,255,0.08);
    color:var(--text-muted);
  }

  /* ---------- modal ---------- */
  .overlay{
    position:fixed;
    inset:0;
    background:rgba(8,6,6,0.72);
    backdrop-filter:blur(2px);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    z-index:10;
    opacity:0;
    pointer-events:none;
    transition:opacity .15s ease;
  }
  .overlay.open{ opacity:1; pointer-events:auto; }
  @media (min-width:640px){
    .overlay{ align-items:center; }
  }

  .modal{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:18px 18px 0 0;
    width:100%;
    max-width:440px;
    max-height:78vh;
    overflow-y:auto;
    padding:22px 22px 26px;
    transform:translateY(16px);
    transition:transform .18s ease;
  }
  .overlay.open .modal{ transform:translateY(0); }
  @media (min-width:640px){
    .modal{ border-radius:18px; }
  }

  .modal-head{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
    padding-bottom:16px;
    border-bottom:1px solid var(--border);
    margin-bottom:16px;
  }
  .modal-date{
    font-family:'Anton',system-ui,sans-serif;
    font-size:20px;
    letter-spacing:0.3px;
    text-transform:uppercase;
    line-height:1.15;
  }
  .modal-date small{
    display:block;
    font-family:'Manrope',sans-serif;
    font-size:11px;
    font-weight:700;
    letter-spacing:1.4px;
    color:var(--accent-strong);
    margin-bottom:4px;
  }
  .modal-close{
    width:32px;height:32px;
    border-radius:50%;
    border:1px solid var(--border);
    background:transparent;
    color:var(--text-muted);
    font-size:16px;
    cursor:pointer;
    flex-shrink:0;
  }
  .modal-close:hover{ color:var(--text); border-color:var(--text-faint); }

  .session{
    display:flex;
    gap:12px;
    padding:12px 0;
    border-bottom:1px solid var(--border);
  }
  .session:last-child{ border-bottom:none; padding-bottom:0; }
  .session-time{
    font-weight:800;
    font-size:14px;
    min-width:52px;
    color:var(--text);
    font-variant-numeric:tabular-nums;
  }
  .session-body{ flex:1; }
  .session-badge{
    display:inline-block;
    font-size:9.5px;
    font-weight:800;
    letter-spacing:0.8px;
    text-transform:uppercase;
    padding:3px 7px;
    border-radius:5px;
    background:rgba(229,38,43,0.18);
    color:#ff9a9c;
    margin-bottom:5px;
  }
  .session-badge.mentoria{
    background:rgba(255,255,255,0.09);
    color:var(--text-muted);
  }
  .session-title{
    font-size:14px;
    font-weight:600;
    line-height:1.35;
  }
  .session-title.pending{
    color:var(--text-muted);
    font-style:italic;
    font-weight:500;
  }
  .session-mentor{
    font-size:11.5px;
    color:var(--text-faint);
    margin-top:4px;
  }

  .empty-state{
    text-align:center;
    padding:22px 6px 6px;
    color:var(--text-muted);
    font-size:13.5px;
    line-height:1.5;
  }

  @media (max-width:520px){
    .app{ padding:16px 12px 18px; }
    .brand-tag{ display:none; }
    .day{ padding:6px 6px; gap:4px; }
    .event-chip{ font-size:9px; }
    .day-number{ width:22px;height:22px;font-size:13px; }
    .month-title{ min-width:0; }
  }
</style>

<script>
(function(){
  var MONTHS = [
    { year:2026, month:8,  label:'Septiembre' },
    { year:2026, month:9,  label:'Octubre' },
    { year:2026, month:10, label:'Noviembre' }
  ];

  var DIA_SEMANA = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];

  // Temas confirmados por fecha. Se van añadiendo mes a mes.
  var TOPICS = {
    '2026-09-22': 'Técnicas de edición'
  };

  // Fechas donde la clase recurrente de ese día de la semana NO ocurre (se movió o se canceló).
  var CANCELLED_DATES = ['2026-09-25'];

  // Clases puntuales fuera del patrón semanal habitual (ej. una clase reprogramada).
  var EXTRA_EVENTS = {
    '2026-09-28': [{
      time:'18:00',
      type:'mentoria',
      mentor:'Ricardo Niño',
      title:'Packaging efectivo',
      pending:false
    }]
  };

  function getEventsForDate(dateObj, key){
    var events = [];
    var dow = dateObj.getDay(); // 2 = martes, 5 = viernes
    if((dow === 2 || dow === 5) && CANCELLED_DATES.indexOf(key) === -1){
      var mentor = dow === 2 ? 'Pablo' : 'Ricardo Niño';
      var topic = TOPICS[key];
      events.push({
        time:'18:00',
        type:'mentoria',
        mentor:mentor,
        title: topic || 'Tema por confirmar',
        pending: !topic
      });
    }
    if(EXTRA_EVENTS[key]) events = events.concat(EXTRA_EVENTS[key]);
    return events.length ? events : null;
  }

  function pad(n){ return n < 10 ? '0'+n : ''+n; }
  function keyFor(y,m,d){ return y+'-'+pad(m+1)+'-'+pad(d); }
  function sameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }

  var today = new Date();
  var todayMidnight = new Date(today.getFullYear(), today.getMonth(), today.getDate());

  var currentIndex = MONTHS.findIndex(function(m){ return m.year===today.getFullYear() && m.month===today.getMonth(); });
  if(currentIndex === -1){
    var firstStart = new Date(MONTHS[0].year, MONTHS[0].month, 1);
    currentIndex = todayMidnight < firstStart ? 0 : MONTHS.length - 1;
  }

  var grid = document.getElementById('grid');
  var monthTitle = document.getElementById('monthTitle');
  var monthDots = document.getElementById('monthDots');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');
  var overlay = document.getElementById('overlay');
  var modalDate = document.getElementById('modalDate');
  var modalBody = document.getElementById('modalBody');
  var modalClose = document.getElementById('modalClose');

  MONTHS.forEach(function(){
    var dot = document.createElement('span');
    monthDots.appendChild(dot);
  });

  function openModal(dateObj, dayEvents){
    var label = DIA_SEMANA[dateObj.getDay()] + ' ' + dateObj.getDate() + ' de ' + MONTHS.find(function(m){return m.month===dateObj.getMonth();}).label.toLowerCase();
    modalDate.innerHTML = '<small>Calendario de clases</small>' + label;
    if(!dayEvents || dayEvents.length === 0){
      modalBody.innerHTML = '<div class="empty-state">Sin clases programadas este día.<br>Añadiremos las sesiones en cuanto estén confirmadas.</div>';
    } else {
      modalBody.innerHTML = dayEvents.map(function(ev){
        var badgeText = ev.type === 'masterclass' ? 'Masterclass en vivo' : 'Mentoría en vivo';
        var badgeClass = ev.type === 'masterclass' ? '' : 'mentoria';
        return '<div class="session">' +
          '<div class="session-time">'+ev.time+'</div>' +
          '<div class="session-body">' +
            '<span class="session-badge '+badgeClass+'">'+badgeText+'</span>' +
            '<div class="session-title'+(ev.pending ? ' pending' : '')+'">'+ev.title+'</div>' +
            '<div class="session-mentor">Mentor: '+ev.mentor+'</div>' +
          '</div>' +
        '</div>';
      }).join('');
    }
    overlay.classList.add('open');
  }
  function closeModal(){ overlay.classList.remove('open'); }
  modalClose.addEventListener('click', closeModal);
  overlay.addEventListener('click', function(e){ if(e.target === overlay) closeModal(); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeModal(); });

  function render(){
    var m = MONTHS[currentIndex];
    monthTitle.innerHTML = m.label + ' <span class="year">' + m.year + '</span>';

    Array.prototype.forEach.call(monthDots.children, function(dot, i){
      dot.classList.toggle('active', i === currentIndex);
    });

    prevBtn.disabled = currentIndex === 0;
    nextBtn.disabled = currentIndex === MONTHS.length - 1;

    grid.innerHTML = '';
    var firstOfMonth = new Date(m.year, m.month, 1);
    var leading = (firstOfMonth.getDay() + 6) % 7;
    var daysInMonth = new Date(m.year, m.month + 1, 0).getDate();
    var totalCells = Math.ceil((leading + daysInMonth) / 7) * 7;

    for(var i = 0; i < totalCells; i++){
      var dayNum = i - leading + 1;
      var cell = document.createElement('div');

      if(dayNum < 1 || dayNum > daysInMonth){
        cell.className = 'day blank';
        grid.appendChild(cell);
        continue;
      }

      var dateObj = new Date(m.year, m.month, dayNum);
      var isPast = dateObj < todayMidnight;
      var isToday = sameDay(dateObj, todayMidnight);
      var key = keyFor(m.year, m.month, dayNum);
      var dayEvents = getEventsForDate(dateObj, key);

      cell.className = 'day' + (isPast ? ' past' : '') + (isToday ? ' today' : '');
      cell.tabIndex = 0;
      cell.setAttribute('role','button');
      cell.setAttribute('aria-label', 'Ver clases del ' + dayNum + ' de ' + m.label);

      var numEl = document.createElement('div');
      numEl.className = 'day-number';
      numEl.textContent = dayNum;
      cell.appendChild(numEl);

      if(dayEvents && dayEvents.length){
        var evWrap = document.createElement('div');
        evWrap.className = 'day-events';
        dayEvents.forEach(function(ev){
          var chip = document.createElement('div');
          chip.className = 'event-chip' + (ev.type === 'mentoria' ? ' mentoria' : '');
          chip.textContent = ev.time + ' · ' + ev.mentor;
          evWrap.appendChild(chip);
        });
        cell.appendChild(evWrap);
      }

      (function(dateObj, dayEvents){
        cell.addEventListener('click', function(){ openModal(dateObj, dayEvents); });
        cell.addEventListener('keydown', function(e){
          if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openModal(dateObj, dayEvents); }
        });
      })(dateObj, dayEvents);

      grid.appendChild(cell);
    }
  }

  prevBtn.addEventListener('click', function(){ if(currentIndex > 0){ currentIndex--; render(); } });
  nextBtn.addEventListener('click', function(){ if(currentIndex < MONTHS.length - 1){ currentIndex++; render(); } });

  render();
})();
</script>
